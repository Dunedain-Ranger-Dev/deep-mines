plugins {
    id 'java-library'
    id 'net.neoforged.moddev' version '2.0.148'
    id 'idea'
}

tasks.named('wrapper', Wrapper).configure {
    distributionType = Wrapper.DistributionType.BIN
}

version = mod_version
group = mod_group_id

sourceSets.main.resources {
    // Include resources generated by data generators (the Mines' pieces).
    srcDir('src/generated/resources')
    exclude("src/generated/**/.cache") // datagen cache files
}

repositories {
    // MixinSquared, which Dungeon Delving bundles.
    exclusiveContent {
        forRepository {
            maven {
                name = "Bawnorton"
                url = "https://maven.bawnorton.com/releases"
            }
        }
        filter {
            includeGroup "com.github.bawnorton.mixinsquared"
        }
    }
    // CurseMaven: mods from CurseForge, for Custom Portal API Reforged (the portal) and Apotheosis (which Dungeon Delving needs).
    exclusiveContent {
        forRepository {
            maven {
                name = "CurseMaven"
                url = "https://cursemaven.com"
            }
        }
        filter {
            includeGroup "curse.maven"
        }
    }
}

base {
    archivesName = mod_id
}

java.toolchain.languageVersion = JavaLanguageVersion.of(21)

neoForge {
    version = project.neo_version

    parchment {
        mappingsVersion = project.parchment_mappings_version
        minecraftVersion = project.parchment_minecraft_version
    }

    runs {
        client {
            client()
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }
        server {
            server()
            programArgument '--nogui'
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }
        data {
            data()
            // ./gradlew runData builds the Mines' pieces into src/generated/resources/ (see MinePieceProvider).
            programArguments.addAll '--mod', project.mod_id, '--all', '--output', file('src/generated/resources/').getAbsolutePath(), '--existing', file('src/main/resources/').getAbsolutePath()
        }
        gameTestServer {
            type = "gameTestServer"
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }
        configureEach {
            systemProperty 'forge.logging.markers', 'REGISTRIES'
            logLevel = org.slf4j.event.Level.DEBUG
        }
    }

    mods {
        "${mod_id}" {
            sourceSet(sourceSets.main)
        }
    }
}

// Sets up a dependency configuration called 'localRuntime': mods loaded in dev runs and game tests, but left out of
// this mod's published dependencies (Dungeon Delving is declared in neoforge.mods.toml instead).
configurations {
    runtimeClasspath.extendsFrom localRuntime
}

// Dungeon Delving: its layout generator and builder build the Mines' floors (see settings.gradle).
def dungeonDelving = 'io.github.ranger3462.dungeondelving:dungeon-delving'

dependencies {
    // Custom Portal API Reforged: the Mines portal (a nether-style portal with our own frame). Required at runtime.
    implementation "curse.maven:custom-portal-api-reforged-902717:6744404" // cpapireforged-neo-1.21.1-1.2.2

    compileOnly dungeonDelving
    // Left out of runData, which doesn't need them (and Apotheosis' own data generators fail without Gateways).
    if (!gradle.startParameter.taskNames.any { it.toLowerCase().contains('rundata') }) {
        localRuntime dungeonDelving
        // Apotheosis and its libraries, which Dungeon Delving requires. Versions match the pack's pack.json.
        localRuntime "curse.maven:apotheosis-313970:8993983"                 // 1.21.1-8.9.0
        localRuntime "curse.maven:placebo-283644:9153039"                    // 1.21.1-9.9.4
        localRuntime "curse.maven:apothic-attributes-898963:9006294"         // 1.21.1-2.11.0
        // Iron's Spells and its libraries, for Dungeon Delving's spellcasting mobs (it only compiles against them, but
        // its mobs need them loaded at runtime). Versions match Dungeon Delving's and the pack's.
        localRuntime "curse.maven:irons-spells-n-spellbooks-855414:8680204"  // 1.21.1-3.16.3
        localRuntime "curse.maven:irons-lib-1492763:8973642"                 // 1.21.1-2.2.0
        localRuntime "curse.maven:playeranimator-658587:7389814"             // 2.0.4+1.21.1
        localRuntime "curse.maven:geckolib-388172:8893490"                   // 4.9.3
        localRuntime "curse.maven:curios-309927:6529130"                     // 9.5.1+1.21.1
    }
}

var generateModMetadata = tasks.register("generateModMetadata", ProcessResources) {
    var replaceProperties = [
            minecraft_version      : minecraft_version,
            minecraft_version_range: minecraft_version_range,
            neo_version            : neo_version,
            loader_version_range   : loader_version_range,
            mod_id                 : mod_id,
            mod_name               : mod_name,
            mod_license            : mod_license,
            mod_version            : mod_version,
            // Dungeon Delving is required, except while generating data, which runs without it (see dependencies).
            dd_dependency_type     : gradle.startParameter.taskNames.any { it.toLowerCase().contains('rundata') } ? 'optional' : 'required',
    ]
    inputs.properties replaceProperties
    expand replaceProperties
    from "src/main/templates"
    into "build/generated/sources/modMetadata"
}
sourceSets.main.resources.srcDir generateModMetadata
neoForge.ideSyncTask generateModMetadata

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

idea {
    module {
        downloadSources = true
        downloadJavadoc = true
    }
}
